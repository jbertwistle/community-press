<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>Community Press v1.7</title>

    <link rel="stylesheet" href="style.css">

    <!-- Fabric.js -->
    <script src="https://cdn.jsdelivr.net/npm/fabric@7.4.0/dist/index.min.js"></script>
</head>

<body>

<main id="press">

    <!-- ============================================
         WORKSPACE
    ============================================= -->

    <section id="sheet">

        <header id="machineHeader">

            <div class="machineIdentity">
                <p>community_press · v1.7</p>
                <p>sheet: <span id="sheetNumber">00001</span></p>
            </div>

            <div
                id="machineStatus"
                role="status"
                aria-live="polite"
            >
                status: ready
            </div>

        </header>

        <div id="canvasFrame">
            <canvas id="pressCanvas"></canvas>
        </div>

    </section>


    <!-- ============================================
         TOOL TRAY
    ============================================= -->

    <nav id="toolTray" aria-label="Community Press tools">

        <button id="newSheet" type="button">
    NEW
</button>

        <button id="headlineButton" type="button">
            <span aria-hidden="true">A</span>
            HEADLINE
        </button>

        <button id="textButton" type="button">
            <span aria-hidden="true">¶</span>
            WORDS
        </button>

        <button id="talkButton" type="button">
            <span aria-hidden="true">●</span>
            TALK
        </button>

        <button id="photoButton" type="button">
            <span aria-hidden="true">▣</span>
            IMAGE
        </button>

        <button id="shapesButton" type="button">
            <span aria-hidden="true">●</span>
            SHAPES
        </button>

        <button id="drawButton" type="button">
            <span aria-hidden="true">✎</span>
            DRAW
        </button>

        <button id="undoButton" type="button">
            <span aria-hidden="true">↶</span>
            UNDO
        </button>

        <button id="duplicateButton" type="button">
            <span aria-hidden="true">⧉</span>
            DUPLICATE
        </button>

        <button id="deleteButton" type="button">
            <span aria-hidden="true">×</span>
            DELETE
        </button>

        <button id="publishButton" type="button">
            <span aria-hidden="true">▤</span>
            PUBLISH &amp; PRINT
        </button>

    </nav>


    <!-- ============================================
         SHAPE TRAY
    ============================================= -->

    <section
        id="shapeTray"
        class="popoutTray hidden"
        aria-label="Insert shape"
    >

        <button
            type="button"
            data-shape="circle"
            aria-label="Insert circle"
        >
            ●
        </button>

        <button
            type="button"
            data-shape="square"
            aria-label="Insert square"
        >
            ■
        </button>

        <button
            type="button"
            data-shape="triangle"
            aria-label="Insert triangle"
        >
            ▲
        </button>

        <button
            type="button"
            data-shape="star"
            aria-label="Insert star"
        >
            ★
        </button>

        <button
            type="button"
            data-shape="wing"
            aria-label="Insert wing"
        >
            WING
        </button>

    </section>


    <!-- ============================================
         LATEST EDITIONS
    ============================================= -->

    <section id="archive">

        <p id="publicationNotice">
            COMMUNITY PRESS IS MADE BY ITS READERS.
            PUBLICATION DOES NOT IMPLY ENDORSEMENT.
        </p>

        <div class="archiveHeader">
            <span>LATEST EDITIONS</span>
            <span id="editionCount">0 sheets</span>
        </div>

        <div id="latestEditions"></div>

    </section>


    <!-- Hidden image picker -->

    <input
        id="photoInput"
        type="file"
        accept="image/*"
        hidden
    >

</main>

<!-- ==============================================
     ARTICLE EDITOR
================================================ -->

<div id="articleEditor" class="articleEditor hidden">
    <section
        class="articleEditorPanel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="articleEditorTitle"
    >
        <header class="articleEditorHeader">
            <h2 id="articleEditorTitle">ARTICLE</h2>
            <p>Write once. Flow into columns.</p>
        </header>

        <label for="articleText">ARTICLE TEXT</label>
        <textarea
            id="articleText"
            rows="12"
            placeholder="Type or dictate an article."
        ></textarea>

        <fieldset class="columnChoices">
            <legend>COLUMNS</legend>
            <button type="button" data-columns="1">1 COL</button>
            <button type="button" data-columns="2">2 COL</button>
            <button type="button" data-columns="3">3 COL</button>
        </fieldset>

        <fieldset class="articlePhotoControls">
            <legend>ARTICLE PHOTO</legend>

            <div class="articlePhotoPicker">
                <button id="chooseArticlePhoto" type="button">
                    CHOOSE PHOTO
                </button>
                <span id="articlePhotoStatus">no photo selected</span>
            </div>

            <input
                id="articlePhotoInput"
                type="file"
                accept="image/*"
                hidden
            >

            <img
                id="articlePhotoPreview"
                class="hidden"
                alt="Selected article photograph"
            >

            <div class="photoPositionChoices">
                <button type="button" data-photo-position="none">NO PHOTO</button>
                <button type="button" data-photo-position="left">PHOTO LEFT</button>
                <button type="button" data-photo-position="right">PHOTO RIGHT</button>
                <button type="button" data-photo-position="across">PHOTO ACROSS</button>
            </div>
        </fieldset>

        <div class="articleEditorActions">
            <button id="cancelArticle" type="button">CANCEL</button>
            <button id="saveArticle" type="button">PLACE ARTICLE</button>
        </div>
    </section>
</div>


<!-- ==============================================
     FULL-SIZE PUBLISHED SHEET VIEWER
================================================ -->

<div id="editionViewer" class="hidden">

    <div id="viewerPanel">

        <button id="closeViewer" type="button">
            CLOSE
        </button>

        <img
            id="publishedSheet"
            alt="Published Community Press sheet"
        >
<div id="viewerControls">

    <button id="printSheet" type="button">
        PRINT
    </button>

    <button id="downloadSheet" type="button">
    DOWNLOAD
</button>

    <button id="reportSheet" type="button">
        REPORT
    </button>

</div>

</div>

</div>

<!-- The only element exposed to the printer. -->
<div id="printStage" aria-hidden="true">
    <img
        id="printImage"
        alt=""
    >
</div>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Community Press application -->
<script src="script.js"></script>

</body>
</html>
